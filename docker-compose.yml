# This file is designed for production server deployment, not local development work
# For a containerized local dev environment, see: https://github.com/mastodon/mastodon/blob/main/docs/DEVELOPMENT.md#docker

services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    networks:
      - internal_network
    volumes:
      - /mnt/HC_Volume_100097144/postgres14:/var/lib/postgresql/data
    # added from the default, otherwise you'll need to manually create a `mastodon` db and user/role
    env_file: db.env
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    restart: always
    image: redis:7-alpine
    networks:
      - internal_network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
    volumes:
      - ./redis:/data
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build: .
    image: himynameisjonas/hometown:edge
    restart: always
    env_file:
      - .env.production
      - db.env
    command: bundle exec puma -C config/puma.rb
    networks:
      - traefik_proxy
      - internal_network
    healthcheck:
      # prettier-ignore
      test:
        [
          'CMD-SHELL',
          'wget -q --spider --proxy=off localhost:3000/health || exit 1'
        ]
    expose:
      - "3000"
    depends_on:
      - db
      - redis
    volumes:
      - ./public/system:/mastodon/public/system
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.mastodonweb.rule=Host(`tacocat.space`)
      - traefik.http.routers.mastodonweb.entrypoints=websecure
      - traefik.http.routers.mastodonweb.tls.certresolver=letsencrypttls
      - traefik.http.services.mastodonweb.loadbalancer.server.port=3000
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  streaming:
    build:
      dockerfile: ./streaming/Dockerfile
      context: .
    image: himynameisjonas/hometown-streaming:edge
    restart: always
    env_file:
      - .env.production
      - db.env
    command: node ./streaming/index.js
    networks:
      - traefik_proxy
      - internal_network
    healthcheck:
      # prettier-ignore
      test:
        [
          'CMD-SHELL',
          'wget -q --spider --proxy=off localhost:4000/api/v1/streaming/health || exit 1'
        ]
    expose:
      - "4000"

    depends_on:
      - db
      - redis
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.mastodonstreaming.rule=(Host(`tacocat.space`) && PathPrefix(`/api/v1/streaming`))
      - traefik.http.routers.mastodonstreaming.entrypoints=websecure
      - traefik.http.routers.mastodonstreaming.tls.certresolver=letsencrypttls
      - traefik.http.services.mastodonstreaming.loadbalancer.server.port=4000
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  sidekiq:
    build: .
    image: himynameisjonas/hometown:edge
    restart: always
    env_file:
      - .env.production
      - db.env
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    networks:
      - traefik_proxy
      - internal_network
    volumes:
      - ./public/system:/mastodon/public/system
    healthcheck:
      test: [ 'CMD-SHELL', "ps aux | grep '[s]idekiq 8' || false" ]
    logging:
      options:
        max-size: '10m'
        max-file: '3'

networks:
  #the network that your traefik instance has access to
  traefik_proxy:
    external: true
  internal_network:
    internal: true
